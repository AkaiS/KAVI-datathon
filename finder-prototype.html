<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Resource finder</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<!--
  PROTOTYPE, throwaway. Do not link from index.html and do not ship.
  Question: what should one finder look like that gives index.html (Supabase directory, tags) the map,
  filters and location search of scripts/osm/map.html? Only Supabase data is shown; OSM places are left out on purpose.
  Three variants on this one page, switchable via ?variant=A|B|C and the bottom bar (← / → keys):
    A  Map + filter rail     map.html layout, plus "Who it's for" / language facets, a location + radius, Map|List toggle
    B  Guided questions      three questions (need, who, where), then results with List|Map tabs
    C  Search-first split    one search box that turns words into filter chips, list and map side by side
  Data (read-only): Supabase public.resources (760 Connections rows). The base map tiles are OpenFreeMap; no OSM places are loaded.
  public.resources has no lat/lon, so coordinates are joined by organization name from the ArcGIS layer NYPL_Connections_merge.
  Dashed tags are guessed from the description text by keyword; solid tags come from Connections category/subcategory/flags.
-->
<style>
  :root {
    --bg: #fafaf9; --panel: #fff; --text: #1c1917; --muted: #78716c; --line: #e7e5e4; --accent: #0f766e; --accent-soft: #e6f2f0;
    --who: #f3e8ff; --lang: #fef3c7;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  input, select, button { font: inherit; }
  input[type=search], select { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  button { cursor: pointer; }
  a { color: var(--accent); }
  #app { height: 100%; }
  .loading { padding: 40px; color: var(--muted); }

  /* Shared pieces */
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; display: inline-block; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .chk { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; }
  .chk input { margin: 0; }
  .chk.zero { opacity: .45; }
  .cards { list-style: none; margin: 0; padding: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .card:hover, .card.hl { border-color: var(--accent); }
  .card.flash { box-shadow: 0 0 0 3px var(--accent-soft); }
  .card-head { display: flex; gap: 8px; align-items: baseline; }
  .card-head .dot { transform: translateY(1px); }
  .card-head strong { flex: 1; }
  .dist { color: var(--accent); font-size: 12px; white-space: nowrap; font-weight: 600; }
  .dist.remote { color: #b45309; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-word; }
  .desc { margin: 6px 0 0; font-size: 13px; }
  .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #f0efed; border: 1px solid transparent; }
  .tag.who { background: var(--who); }
  .tag.lang { background: var(--lang); }
  .tag.inf { background: transparent; border: 1px dashed #a8a29e; color: #57534e; }
  .src { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .more { color: var(--muted); font-size: 12px; padding: 8px 2px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: none; padding: 6px 14px; }
  .seg button[aria-pressed=true] { background: var(--text); color: #fff; }
  .place { position: relative; display: flex; gap: 6px; }
  .place input { flex: 1; }
  .place .me { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 0 10px; }
  .sugg { position: absolute; z-index: 20; top: 100%; left: 0; right: 0; list-style: none; margin: 2px 0 0; padding: 4px 0; background: #fff; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.1); }
  .sugg li { padding: 6px 10px; cursor: pointer; }
  .sugg li:hover { background: var(--bg); }
  .maplibregl-popup-content { padding: 10px 12px; max-height: 320px; overflow: auto; }
  .legend { font-size: 11px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .legend .ring { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 2.5px solid #1c1917; vertical-align: -1px; }

  /* Variant A: map + filter rail */
  .va { display: flex; height: 100%; }
  .va aside { width: 330px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; }
  .va header { padding: 14px 16px 6px; }
  .va h1 { font-size: 17px; margin: 0 0 2px; }
  .va .sub { color: var(--muted); font-size: 12px; margin: 0; }
  .va .ctl { padding: 8px 16px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .va .row { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  .va .row select { width: auto; }
  .va details { border-bottom: 1px solid var(--line); padding: 8px 16px; }
  .va summary { font-weight: 600; cursor: pointer; padding: 2px 0 4px; }
  .va summary b { color: var(--accent); }
  .va main { flex: 1; position: relative; display: flex; flex-direction: column; min-width: 0; }
  .va .viewbar { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .va .stage { flex: 1; position: relative; min-height: 0; }
  .va #a-map { position: absolute; inset: 0; }
  .va .drawer { position: absolute; top: 10px; left: 10px; bottom: 10px; width: 320px; background: rgba(250,250,249,.97); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; box-shadow: 0 4px 18px rgba(0,0,0,.12); }
  .va .drawer .cards { overflow-y: auto; padding: 8px; flex: 1; }
  .va .drawer .hd { padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .va .listview { position: absolute; inset: 0; overflow-y: auto; padding: 16px; }
  .va .listview .cards { max-width: 860px; margin: 0 auto; }

  /* Variant B: guided questions */
  .vb { min-height: 100%; }
  .vb .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 90px; }
  .vb .progress { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .vb h1 { font-size: 26px; margin: 6px 0 4px; }
  .vb h2 { font-size: 15px; margin: 22px 0 8px; }
  .vb .sub { color: var(--muted); margin: 0 0 16px; }
  .vb .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .vb .tile { text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 12px; display: flex; gap: 8px; align-items: center; }
  .vb .tile[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); }
  .vb .tile:disabled { opacity: .4; cursor: default; }
  .vb .nav { display: flex; justify-content: space-between; margin-top: 28px; }
  .vb .nav button { padding: 10px 18px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  .vb .nav .go { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .vb .radii { display: flex; gap: 6px; flex-wrap: wrap; }
  .vb .radii button, .vb .bor button { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; }
  .vb .radii button[aria-pressed=true], .vb .bor button[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); }
  .vb .bor { display: flex; gap: 6px; flex-wrap: wrap; }
  .vb .res { display: flex; flex-direction: column; height: 100vh; }
  .vb .res-head { padding: 16px 20px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .vb .sentence { font-size: 20px; margin: 0 0 10px; line-height: 1.35; }
  .vb .sentence a { color: var(--accent); text-decoration: underline dotted; text-underline-offset: 4px; cursor: pointer; font-weight: 600; }
  .vb .res-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .vb .res-tools input { max-width: 300px; }
  .vb .langs { display: flex; gap: 4px; flex-wrap: wrap; }
  .vb .langs button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .vb .langs button[aria-pressed=true] { background: var(--lang); border-color: #d97706; }
  .vb .res-body { flex: 1; position: relative; min-height: 0; }
  .vb .res-list { position: absolute; inset: 0; overflow-y: auto; padding: 16px 20px 70px; }
  .vb .res-list section { max-width: 820px; margin: 0 auto; }
  .vb .res-list h3 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 8px; }
  .vb #b-map { position: absolute; inset: 0; }

  /* Variant C: search-first split */
  .vc { display: flex; flex-direction: column; height: 100%; }
  .vc .top { display: flex; gap: 14px; align-items: center; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .vc .brand { font-weight: 700; white-space: nowrap; }
  .vc .omni { position: relative; flex: 1; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; padding: 5px 8px; background: #fff; }
  .vc .omni:focus-within { border-color: var(--accent); }
  .vc .omni input { flex: 1; min-width: 200px; border: 0; outline: none; padding: 5px 2px; font-size: 15px; }
  .vc .chip { display: inline-flex; gap: 6px; align-items: center; border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 13px; background: #f0efed; }
  .vc .chip.who { background: var(--who); } .vc .chip.lang { background: var(--lang); } .vc .chip.place { background: #fee2e2; } .vc .chip.q { background: #e0f2fe; }
  .vc .chip small { color: var(--muted); }
  .vc .chip button { border: 0; background: rgba(0,0,0,.08); border-radius: 50%; width: 18px; height: 18px; line-height: 16px; padding: 0; font-size: 12px; }
  .vc .drop { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; right: 0; list-style: none; margin: 0; padding: 6px 0; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.12); max-height: 60vh; overflow-y: auto; }
  .vc .drop li { padding: 6px 12px; display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .vc .drop li.on { background: var(--accent-soft); }
  .vc .drop li.grp { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; cursor: default; padding-top: 10px; }
  .vc .drop .k { color: var(--muted); font-size: 12px; width: 70px; flex: none; }
  .vc .bar { display: flex; gap: 12px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .vc .bar label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .vc .bar select { width: auto; padding: 4px 6px; }
  .vc .body { flex: 1; display: flex; min-height: 0; }
  .vc .results { overflow-y: auto; padding: 12px 14px 70px; }
  .vc .results h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 8px 0 8px; }
  .vc .body.split .results { width: 44%; flex: none; border-right: 1px solid var(--line); }
  .vc .body.list .results { flex: 1; } .vc .body.list .results > div { max-width: 860px; margin: 0 auto; }
  .vc .body.map .results { display: none; }
  .vc .mapbox { flex: 1; position: relative; }
  .vc .body.list .mapbox { display: none; }
  .vc #c-map { position: absolute; inset: 0; }
  .vc .hint { position: absolute; z-index: 5; top: 10px; left: 10px; background: rgba(255,255,255,.95); border-radius: 6px; padding: 4px 8px; font-size: 12px; color: var(--muted); box-shadow: 0 1px 4px rgba(0,0,0,.15); }

  /* Prototype switcher: not part of any design. */
  #proto-bar { position: fixed; z-index: 1000; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; background: #111; color: #fff; border-radius: 999px; padding: 5px; box-shadow: 0 6px 24px rgba(0,0,0,.35); font: 13px system-ui, sans-serif; }
  #proto-bar button { background: #333; color: #fff; border: 0; border-radius: 999px; min-width: 30px; height: 30px; padding: 0 10px; }
  #proto-bar span { padding: 0 10px; white-space: nowrap; }
  #proto-state { position: fixed; z-index: 1000; bottom: 60px; left: 50%; transform: translateX(-50%); width: min(560px, 94vw); max-height: 50vh; overflow: auto; background: #111; color: #d4d4d4; border-radius: 10px; padding: 12px; font: 11px/1.45 ui-monospace, monospace; margin: 0; white-space: pre-wrap; }
  @media (max-width: 760px) {
    .va { flex-direction: column; } .va aside { width: 100%; max-height: 50vh; } .va .drawer { display: none; }
    .vc .body.split { flex-direction: column; } .vc .body.split .results { width: 100%; height: 50%; border-right: 0; }
    .vc .brand { display: none; }
  }
</style>
</head>
<body>
<div id="app"><p class="loading">Loading resources from Supabase and their coordinates…</p></div>
<div id="proto-bar" hidden><button id="proto-prev" title="Previous variant (←)">‹</button><span id="proto-label"></span><button id="proto-next" title="Next variant (→)">›</button><button id="proto-toggle-state" title="Show the filter state">state</button></div>
<pre id="proto-state" hidden></pre>

<script>
// ---------- Vocabulary: the three tag families every record is described by ----------
const SERVICES = [
  ['health', 'Health & mental health', '#CC79A7'],
  ['addiction', 'Addiction & recovery', '#882255'],
  ['legal', 'Legal help', '#332288'],
  ['housing', 'Housing & shelter', '#0072B2'],
  ['food', 'Food', '#E69F00'],
  ['money', 'Money & benefits', '#B8A11E'],
  ['jobs', 'Jobs & training', '#56B4E9'],
  ['education', 'Education', '#44AA99'],
]
const WHO = [
  ['youth', 'Youth'], ['women', 'Women'], ['lgbtq', 'LGBTQI+'], ['older', 'Older people'], ['veterans', 'Veterans'],
  ['immigrants', 'Immigrants'], ['disabilities', 'People with disabilities'], ['parents', 'Parents & caregivers'],
  ['justice', 'Justice-involved & reentry'], ['homeless', 'People without homes'], ['survivors', 'Survivors of violence'],
]
const LANGS = [['spanish', 'Spanish'], ['chinese', 'Chinese'], ['russian', 'Russian'], ['haitian', 'Haitian Creole'], ['arabic', 'Arabic'], ['bengali', 'Bengali'], ['korean', 'Korean'], ['french', 'French']]
const HOW = [['in_person', 'In person'], ['remote', 'Phone / online only']]
const BOROUGHS = ['Manhattan', 'Bronx', 'Brooklyn', 'Queens', 'Staten Island'].map((b) => [b, b])
const FACETS = { services: SERVICES, who: WHO, lang: LANGS, how: HOW, borough: BOROUGHS }
const FACET_TITLE = { services: 'What do you need?', who: "Who it's for", lang: 'Language', how: 'How to reach them', borough: 'Borough' }
const FACET_SHORT = { services: 'Need', who: 'Who', lang: 'Language', how: 'Reach', borough: 'Borough' }
const LABEL = Object.fromEntries(Object.entries(FACETS).map(([f, opts]) => [f, Object.fromEntries(opts.map(([k, l]) => [k, l]))]))
const SCOLOR = Object.fromEntries(SERVICES.map(([k, , c]) => [k, c]))
const RADII = [0.5, 1, 2, 5, 0]
const LIMIT = 150

// Connections category / subcategory -> tags (explicit).
const CONN_SERVICE = { 'Physical & Mental Health': 'health', Legal: 'legal', Housing: 'housing', Addiction: 'addiction', Education: 'education', 'Financial Assistance': 'money', 'Organizations for Job Seekers': 'jobs', 'Preparing for the Job Search': 'jobs' }
const CONN_WHO = { Youth: 'youth', Women: 'women', 'LGBTQI+': 'lgbtq', 'Older People': 'older', Veterans: 'veterans', Immigrants: 'immigrants', 'People with Disabilities': 'disabilities', 'Parents & Caregivers': 'parents', 'Formerly Incarcerated People': 'justice' }
const CONN_SUB = {
  Food: ['services', 'food'], 'Food Stamps (SNAP)': ['services', 'food'], Housing: ['services', 'housing'], 'Medical Care': ['services', 'health'], 'Child Support': ['services', 'legal'],
  'Organizations for People Without Homes': ['who', 'homeless'], 'Drop-In Centers for Single Adults': ['who', 'homeless'], Shelters: ['who', 'homeless'], 'Securing Shelter for Homeless Families': ['who', 'homeless'],
  'Resources & Counseling Related to Sexual Violence': ['who', 'survivors'], 'Victim Assistance': ['who', 'survivors'], 'Reporting Sexual Abuse & Assault (PREA)': ['who', 'survivors'],
}
// Keyword guesses from free text (shown dashed).
const WHO_KW = {
  youth: /\b(youth|young (people|adults?|men|women)|teens?|teenagers?|adolescents?|ages? 1\d|kids)\b/i,
  women: /\b(women|woman|girls|mothers|female)\b/i,
  lgbtq: /\b(lgbt\w*|transgender|queer|gay|lesbian|bisexual)\b/i,
  older: /\b(seniors?|older (adults|people|new yorkers)|elderly)\b/i,
  veterans: /\bveterans?\b/i,
  immigrants: /\b(immigra\w*|undocumented|asylum|refugees?|migrants?)\b/i,
  disabilities: /\b(disabilit\w*|disabled|deaf|blind)\b/i,
  parents: /\b(parents?|caregivers?|fathers)\b/i,
  justice: /\b(incarcerat\w*|re-?entry|formerly|justice[- ]involved|prison|jail|parole|probation)\b/i,
  homeless: /\b(homeless\w*|unhoused|without homes)\b/i,
  survivors: /\b(survivors?|domestic violence|sexual (assault|violence|abuse)|trafficking|gun violence|crime victims?)\b/i,
}
const SERVICE_KW = {
  health: /\b(health|medical|clinic|mental|counseling|therapy|hiv)\b/i, addiction: /\b(addiction|substance|harm reduction|alcohol)\b/i,
  legal: /\b(legal|lawyers?|attorneys?|court)\b/i, housing: /\b(housing|shelters?|tenants?)\b/i, food: /\b(food|pantry|meals?|snap)\b/i,
  money: /\b(financial|benefits|cash assistance|taxes)\b/i, jobs: /\b(jobs?|employment|career|workforce|vocational)\b/i,
  education: /\b(education|ged|hse|esol|literacy|college|tutoring)\b/i,
}
const LANG_KW = {
  spanish: /\b(spanish|español|bilingual)\b/i, chinese: /\b(chinese|mandarin|cantonese)\b/i, russian: /\brussian\b/i, haitian: /\b(haitian|kreyol|kreyòl|creole)\b/i,
  arabic: /\barabic\b/i, bengali: /\b(bengali|bangla)\b/i, korean: /\bkorean\b/i, french: /\bfrench\b/i,
}
// Search words -> substrings that also count as a match.
const SYN = {
  lawyer: ['legal', 'attorney', 'lawyer'], attorney: ['legal', 'attorney', 'lawyer'], shelter: ['shelter', 'housing', 'homeless'],
  therapy: ['therap', 'counsel', 'mental'], therapist: ['therap', 'counsel', 'mental'], counseling: ['counsel', 'therap'],
  kids: ['youth', 'child', 'kids', 'young'], teen: ['teen', 'youth', 'young'], teens: ['teen', 'youth', 'young'],
  job: ['job', 'employ', 'career'], jobs: ['job', 'employ', 'career'], work: ['job', 'employ', 'work'], pantry: ['pantry', 'food'],
  rehab: ['rehab', 'addiction', 'recovery', 'treatment', 'substance'], lgbt: ['lgbt', 'queer', 'transgender', 'gay'], immigration: ['immigra'],
  ged: ['ged', 'hse', 'high school equivalency'], dv: ['domestic violence'],
}

const ARCGIS = 'https://services6.arcgis.com/OO2s4OoyCZkYJ6oE/arcgis/rest/services/NYPL_Connections_merge/FeatureServer/0/query?where=1%3D1&outFields=USER_Organization_Name,Organization_Name,USER_Zip_Code,Zip_Code&outSR=4326&f=geojson'

const $ = (sel, root = document) => root.querySelector(sel)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const safeUrl = (u) => (/^https?:\/\//i.test(u) ? u : u ? `https://${u}` : '')
const norm = (s) => String(s ?? '').toLowerCase().replace(/[^a-z0-9]/g, '')

let all = []
const stats = {}

// ---------- Load and normalize ----------
function blank(source) {
  return { source, tags: { services: new Set(), who: new Set(), lang: new Set(), how: new Set(), borough: new Set() }, inferred: new Set() }
}
function addTag(r, facet, key, inferred = false) {
  const id = `${facet}:${key}`
  if (r.tags[facet].has(key)) { if (!inferred) r.inferred.delete(id); return }
  r.tags[facet].add(key)
  if (inferred) r.inferred.add(id)
}
function inferFrom(r, text, { services }) {
  for (const [k, re] of Object.entries(WHO_KW)) if (re.test(text)) addTag(r, 'who', k, true)
  for (const [k, re] of Object.entries(LANG_KW)) if (re.test(text)) addTag(r, 'lang', k, true)
  if (services && !r.tags.services.size) for (const [k, re] of Object.entries(SERVICE_KW)) if (re.test(text)) addTag(r, 'services', k, true)
}
function boroughFromZip(z) {
  const n = parseInt(z, 10)
  if (n >= 10001 && n <= 10282) return 'Manhattan'
  if (n >= 10301 && n <= 10314) return 'Staten Island'
  if (n >= 10451 && n <= 10475) return 'Bronx'
  if (n >= 11201 && n <= 11256) return 'Brooklyn'
  if ((n >= 11004 && n <= 11109) || (n >= 11351 && n <= 11697)) return 'Queens'
  return ''
}
function finish(r) {
  r.hay = [r.name, r.desc, r.sub, r.address, ...Object.entries(r.tags).flatMap(([f, set]) => [...set].map((k) => LABEL[f][k]))].join(' ').toLowerCase()
  r.color = SCOLOR[[...r.tags.services][0]] ?? '#6b7280'
  return r
}

async function load() {
  const cfg = window.APP_CONFIG
  const db = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY)
  const [sb, arc] = await Promise.all([
    db.from('resources').select('*').range(0, 1999),
    fetch(ARCGIS).then((r) => r.json()),
  ])
  if (sb.error) throw new Error(`Supabase: ${sb.error.message}`)

  const points = new Map()
  for (const f of arc.features) {
    const [lon, lat] = f.geometry?.coordinates ?? []
    const p = f.properties
    const key = norm(p.USER_Organization_Name ?? p.Organization_Name)
    if (!lon || !key) continue
    if (!points.has(key)) points.set(key, [])
    points.get(key).push({ lon, lat, zip: String(p.USER_Zip_Code ?? p.Zip_Code ?? '') })
  }

  Object.assign(stats, { supabaseRows: sb.data.length, connectionsWithCoords: 0, connectionsAddressNoCoords: 0, connectionsPhoneOnline: 0 })
  for (const row of sb.data) {
    const r = blank('connections')
    r.name = row.organization_name || '(No organization name)'
    r.noName = !row.organization_name
    r.desc = row.description ?? ''
    r.sub = [row.category, row.subcategory].filter(Boolean).join(' · ')
    const street = [row.street_number, row.street].filter(Boolean).join(' ')
    const cityLine = [row.city, [row.state, row.zip_code].filter(Boolean).join(' ')].filter(Boolean).join(', ')
    r.address = [street, row.address_line_2, cityLine].filter(Boolean).join(', ')
    r.phone = row.phone_number
    r.website = row.website
    const cands = points.get(norm(row.organization_name)) ?? []
    const pt = cands.find((c) => c.zip && c.zip === String(row.zip_code ?? '')) ?? cands[0]
    if (pt) { r.lat = pt.lat; r.lon = pt.lon; stats.connectionsWithCoords++ }
    if (CONN_SERVICE[row.category]) addTag(r, 'services', CONN_SERVICE[row.category])
    if (CONN_WHO[row.category]) addTag(r, 'who', CONN_WHO[row.category])
    if (CONN_SUB[row.subcategory]) addTag(r, ...CONN_SUB[row.subcategory])
    if (row.works_with_currently_incarcerated) addTag(r, 'who', 'justice')
    if (row.spanish_speaking) addTag(r, 'lang', 'spanish')
    inferFrom(r, `${r.name} ${r.desc} ${row.subcategory ?? ''}`, { services: true })
    if (pt || street) addTag(r, 'how', 'in_person')
    else { addTag(r, 'how', 'remote'); stats.connectionsPhoneOnline++ }
    if (street && !pt) stats.connectionsAddressNoCoords++
    const b = boroughFromZip(row.zip_code)
    if (b) addTag(r, 'borough', b)
    all.push(finish(r))
  }

  all.forEach((r, i) => (r.idx = i))
}

// ---------- Filtering ----------
const newState = () => ({ q: '', services: new Set(), who: new Set(), lang: new Set(), how: new Set(), borough: new Set(), place: null, radius: 2 })
const S = newState()

function miles(a, b) {
  const R = 3958.8, rad = Math.PI / 180
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2
  return 2 * R * Math.asin(Math.sqrt(h))
}
function matchesText(r, q) {
  return q.toLowerCase().split(/\s+/).filter(Boolean).every((t) => (SYN[t] ?? [t]).some((s) => r.hay.includes(s)))
}
// Values inside one facet are OR'd; facets are AND'd. Phone/online resources ignore borough and distance.
function passes(r, s, skip) {
  const remote = r.tags.how.has('remote')
  for (const f of ['services', 'who', 'lang', 'how', 'borough']) {
    if (f === skip || !s[f].size) continue
    if (f === 'borough' && remote) continue
    if (![...s[f]].some((k) => r.tags[f].has(k))) return false
  }
  if (s.q && !matchesText(r, s.q)) return false
  if (s.place && skip !== 'place' && !remote) {
    if (r.lat == null) return false
    if (s.radius && miles(s.place, r) > s.radius) return false
  }
  return true
}
function results(s) {
  const out = all.filter((r) => passes(r, s))
  for (const r of out) r.dist = s.place && r.lat != null && !r.tags.how.has('remote') ? miles(s.place, r) : null
  out.sort((a, b) => (a.dist ?? Infinity) - (b.dist ?? Infinity) || !!a.noName - !!b.noName || a.name.localeCompare(b.name))
  return out
}
function counts(s, facet) {
  const c = {}
  for (const r of all) if (passes(r, s, facet)) for (const k of r.tags[facet]) c[k] = (c[k] ?? 0) + 1
  return c
}
const toggle = (set, k) => (set.has(k) ? set.delete(k) : set.add(k))

// ---------- Shared rendering ----------
function tagsHtml(r) {
  const out = []
  for (const f of ['services', 'who', 'lang']) for (const k of r.tags[f]) {
    const inf = r.inferred.has(`${f}:${k}`)
    const cls = f === 'services' ? '' : f
    out.push(`<span class="tag ${cls} ${inf ? 'inf' : ''}" ${inf ? 'title="Guessed from the description"' : ''}>${f === 'services' ? `<span class="dot" style="background:${SCOLOR[k]};width:8px;height:8px;border:0;box-shadow:none"></span> ` : ''}${esc(LABEL[f][k])}</span>`)
  }
  return out.join('')
}
function cardHtml(r, { compact = false } = {}) {
  const web = safeUrl(r.website)
  const dist = r.dist != null ? `<span class="dist">${r.dist.toFixed(1)} mi</span>` : r.tags.how.has('remote') ? '<span class="dist remote">Phone / online</span>' : ''
  const desc = compact && r.desc.length > 200 ? `${r.desc.slice(0, 200)}…` : r.desc
  return `<div class="card-head"><span class="dot" style="background:${r.color}"></span><strong>${esc(r.name)}</strong>${dist}</div>
    <div class="meta">${esc(r.address || 'No street address')}${r.phone ? ` · ${esc(r.phone)}` : ''}${web ? ` · <a href="${esc(web)}" target="_blank" rel="noopener">website</a>` : ''}</div>
    ${desc ? `<p class="desc">${esc(desc)}</p>` : ''}
    <div class="tags">${tagsHtml(r)}</div>
    <div class="src">NYPL Connections${r.sub ? ` · ${esc(r.sub)}` : ''}${r.lat == null && !r.tags.how.has('remote') ? ' · <em>not on map (no coordinates)</em>' : ''}</div>`
}
function renderCards(el, list, opts = {}) {
  el.innerHTML = list.slice(0, LIMIT).map((r) => `<li class="card" data-idx="${r.idx}">${cardHtml(r, opts)}</li>`).join('')
    + (list.length > LIMIT ? `<li class="more">Showing the first ${LIMIT} of ${list.length}. Add a filter or a location to narrow it down.</li>` : '')
    + (!list.length ? '<li class="more">Nothing matches. Remove a filter or widen the distance.</li>' : '')
}
function facetChecks(facet, s) {
  const c = counts(s, facet)
  return FACETS[facet].map(([k, l]) => `<label class="chk ${c[k] ? '' : 'zero'}"><input type="checkbox" data-f="${facet}" value="${esc(k)}" ${s[facet].has(k) ? 'checked' : ''}>${facet === 'services' ? `<span class="dot" style="background:${SCOLOR[k]}"></span>` : ''}<span>${esc(l)}</span><span class="count">${c[k] ?? 0}</span></label>`).join('')
}
// All / In person / Phone-online switch. Every record has exactly one "how" tag, so the counts add up.
function howToggle(s) {
  const c = counts(s, 'how'), cur = s.how.size === 1 ? [...s.how][0] : 'all'
  const opts = [['all', 'All', (c.in_person ?? 0) + (c.remote ?? 0)], ['in_person', 'In person', c.in_person ?? 0], ['remote', 'Phone / online', c.remote ?? 0]]
  return opts.map(([k, l, n]) => `<button data-how="${k}" aria-pressed="${cur === k}">${l} · ${n}</button>`).join('')
}
function setHow(s, k) { s.how.clear(); if (k !== 'all') s.how.add(k) }
const radiusLabel = (r) => (r ? `${r} mi` : 'any distance')
const legendHtml = '<span class="legend"><span>dashed tag = guessed from text</span></span>'

// Location box. Typed text only becomes S.place once it is resolved to a point (picked, Enter, or resolve()).
function placeWidget(el, onChange) {
  el.innerHTML = `<div class="place"><input type="search" placeholder="Address, ZIP or place, or click the map" aria-label="Location"><button type="button" class="me" title="Use my location">◎</button><ul class="sugg" hidden></ul></div><div class="meta place-note"></div>`
  const input = $('input', el), ul = $('.sugg', el), note = $('.place-note', el)
  let timer, feats = [], pending = false
  const setNote = () => { note.textContent = pending ? 'Pick an address from the list, or press Enter to use the best match.' : S.place ? `Searching near: ${S.place.label}` : '' }
  const pick = (f) => { input.value = f.label; ul.hidden = true; pending = false; onChange(f); setNote() }
  async function resolve() {
    const v = input.value.trim()
    if (!pending || !v) return
    clearTimeout(timer)
    feats = feats.length ? feats : await geosearch(v)
    if (feats[0]) pick(feats[0])
    else note.textContent = `No match for “${v}”. Try a street address or a 5-digit ZIP.`
  }
  input.value = S.place?.label ?? ''
  setNote()
  input.oninput = () => {
    clearTimeout(timer)
    feats = []
    const v = input.value.trim()
    pending = !!v
    setNote()
    if (!v) { ul.hidden = true; if (S.place) { onChange(null); setNote() } return }
    timer = setTimeout(async () => {
      const got = await geosearch(v)
      if (input.value.trim() !== v) return
      feats = got
      ul.innerHTML = feats.map((f, i) => `<li data-i="${i}">${esc(f.label)}</li>`).join('')
      ul.hidden = !feats.length
    }, 250)
  }
  ul.onmousedown = (e) => {
    const li = e.target.closest('li')
    if (!li) return
    e.preventDefault()
    pick(feats[+li.dataset.i])
  }
  input.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); resolve() } }
  input.onblur = () => setTimeout(() => (ul.hidden = true), 120)
  $('.me', el).onclick = () => navigator.geolocation?.getCurrentPosition(
    (p) => pick({ lat: p.coords.latitude, lon: p.coords.longitude, label: 'My location' }),
    () => alert('Your browser did not share a location.'),
  )
  return { set: (p) => { input.value = p?.label ?? ''; pending = false; setNote() }, resolve, pending: () => pending }
}
// GeoSearch has no ZIP layer, so a bare ZIP becomes the average position of our own places in that ZIP.
function zipPlace(zip) {
  const pts = all.filter((r) => r.lat != null && new RegExp(`\\b${zip}\\b`).test(r.address))
  if (!pts.length) return null
  return { label: `ZIP ${zip}`, lat: pts.reduce((s, r) => s + r.lat, 0) / pts.length, lon: pts.reduce((s, r) => s + r.lon, 0) / pts.length }
}
async function geosearch(text) {
  const zip = /^\d{5}$/.test(text.trim()) ? zipPlace(text.trim()) : null
  try {
    const d = await (await fetch(`https://geosearch.planninglabs.nyc/v2/autocomplete?text=${encodeURIComponent(text)}`)).json()
    const feats = d.features.slice(0, 6).map((f) => ({ label: f.properties.label.replace(/, USA$/, ''), lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1] }))
    return zip ? [zip, ...feats.slice(0, 3)] : feats
  } catch { return zip ? [zip] : [] }
}

function circle(p, mi) {
  const pts = [], R = 3958.8
  for (let i = 0; i <= 64; i++) {
    const a = (i / 64) * 2 * Math.PI
    const dLat = (mi / R) * Math.cos(a) * (180 / Math.PI)
    const dLon = ((mi / R) * Math.sin(a) * (180 / Math.PI)) / Math.cos((p.lat * Math.PI) / 180)
    pts.push([p.lon + dLon, p.lat + dLat])
  }
  return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [pts] }, properties: {} }
}
const EMPTY = { type: 'FeatureCollection', features: [] }

// Resources at identical coordinates (e.g. several organizations in one building) share one pin.
const pointKey = (r) => `${r.lat.toFixed(6)},${r.lon.toFixed(6)}`
function groupPopupHtml(group) {
  return `<div style="font-weight:600;margin-bottom:6px">${group.length} places at this address</div>`
    + group.map((r) => `<div style="border-top:1px solid var(--line);padding:8px 0">${cardHtml(r, { compact: true })}</div>`).join('')
}

// One MapLibre map. onPick(place) fires on a click on empty map; onSelect(r) on a click on a pin.
function makeMap(container, { onPick, onSelect } = {}) {
  const map = new maplibregl.Map({ container, style: 'https://tiles.openfreemap.org/styles/liberty', bounds: [-74.26, 40.49, -73.7, 40.92], attributionControl: { compact: true } })
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right')
  let ready = false, pending = null, marker = null, lastPlace = null, groups = new Map()
  const api = {
    map,
    update(list, s) { pending = { list, s }; if (ready) draw() },
    popup(r) {
      if (r.lat == null) return
      const group = groups.get(pointKey(r)) ?? [r]
      new maplibregl.Popup({ maxWidth: '300px', focusAfterOpen: false }).setLngLat([r.lon, r.lat]).setHTML(group.length > 1 ? groupPopupHtml(group) : cardHtml(r, { compact: true })).addTo(map)
    },
    fly(r) { if (r.lat == null) return; map.flyTo({ center: [r.lon, r.lat], zoom: Math.max(map.getZoom(), 14) }); api.popup(r) },
    highlight(r) { if (ready) map.setFilter('res-hl', ['==', ['get', 'key'], r?.lat != null ? pointKey(r) : '']) },
    resize() { map.resize() },
  }
  function draw() {
    const { list, s } = pending
    groups = new Map()
    for (const r of list) if (r.lat != null) { const k = pointKey(r); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r) }
    map.getSource('res').setData({ type: 'FeatureCollection', features: [...groups].map(([key, g]) => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [g[0].lon, g[0].lat] }, properties: { key, idx: g[0].idx, count: g.length, color: g.length > 1 ? '#1c1917' : g[0].color, conn: 1 } })) })
    map.getSource('radius').setData(s.place && s.radius ? circle(s.place, s.radius) : EMPTY)
    if (s.place) {
      marker ??= new maplibregl.Marker({ color: '#b91c1c' })
      marker.setLngLat([s.place.lon, s.place.lat]).addTo(map)
      if (lastPlace !== s.place || lastPlace?.r !== s.radius) {
        const r = s.radius || 3
        map.fitBounds([[s.place.lon - r / 45, s.place.lat - r / 60], [s.place.lon + r / 45, s.place.lat + r / 60]], { padding: 40, duration: 600 })
      }
    } else marker?.remove()
    lastPlace = s.place
    if (lastPlace) lastPlace.r = s.radius
  }
  map.on('load', () => {
    map.addSource('radius', { type: 'geojson', data: EMPTY })
    map.addLayer({ id: 'radius-fill', type: 'fill', source: 'radius', paint: { 'fill-color': '#b91c1c', 'fill-opacity': 0.06 } })
    map.addLayer({ id: 'radius-line', type: 'line', source: 'radius', paint: { 'line-color': '#b91c1c', 'line-width': 1.5, 'line-dasharray': [2, 2] } })
    map.addSource('res', { type: 'geojson', data: EMPTY })
    map.addLayer({ id: 'res', type: 'circle', source: 'res', paint: {
      'circle-color': ['get', 'color'],
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, ['case', ['>', ['get', 'count'], 1], 9, 4.5], 14, ['case', ['>', ['get', 'count'], 1], 11, 8], 17, ['case', ['>', ['get', 'count'], 1], 14, 11]],
      'circle-stroke-width': ['case', ['==', ['get', 'conn'], 1], 2.2, 1.2],
      'circle-stroke-color': ['case', ['>', ['get', 'count'], 1], '#ffffff', '#1c1917'],
    } })
    map.addLayer({ id: 'res-count', type: 'symbol', source: 'res', filter: ['>', ['get', 'count'], 1],
      layout: { 'text-field': ['to-string', ['get', 'count']], 'text-font': ['Noto Sans Bold'], 'text-size': 11, 'text-allow-overlap': true, 'text-ignore-placement': true },
      paint: { 'text-color': '#ffffff' } })
    map.addLayer({ id: 'res-hl', type: 'circle', source: 'res', filter: ['==', ['get', 'key'], ''], paint: { 'circle-radius': 16, 'circle-color': 'rgba(0,0,0,0)', 'circle-stroke-width': 3, 'circle-stroke-color': '#0f766e' } })
    map.on('click', (e) => {
      const f = map.queryRenderedFeatures(e.point, { layers: ['res'] })[0]
      if (f) { const r = all[f.properties.idx]; api.popup(r); onSelect?.(r) }
      else onPick?.({ lat: e.lngLat.lat, lon: e.lngLat.lng, label: `Pin at ${e.lngLat.lat.toFixed(4)}, ${e.lngLat.lng.toFixed(4)}` })
    })
    map.on('mouseenter', 'res', () => (map.getCanvas().style.cursor = 'pointer'))
    map.on('mouseleave', 'res', () => (map.getCanvas().style.cursor = ''))
    ready = true
    if (pending) draw()
  })
  return api
}

      <div id="b-pickmap" style="height:320px;margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden"></div>
      <h2>How far can you travel?</h2><div class="radii">${RADII.map((r) => `<button data-r="${r}" aria-pressed="${S.radius === r}">${radiusLabel(r)}</button>`).join('')}</div>
      <h2>Or limit to a borough</h2><div class="bor">${BOROUGHS.map(([b]) => `<button data-b="${b}" aria-pressed="${S.borough.has(b)}">${b}</button>`).join('')}</div>
      <h2>Phone and online help</h2><label class="chk"><input type="checkbox" id="b-remote" ${S.how.has('in_person') ? '' : 'checked'}> Also show hotlines and online resources (they serve all of NYC)</label>
      ${nav(3)}</div>`
  }
  function sentence(n) {
    const join = (f, fallback) => (S[f].size ? [...S[f]].map((k) => LABEL[f][k]).join(' or ') : fallback)
    const where = S.place ? `within ${radiusLabel(S.radius)} of ${S.place.label}` : S.borough.size ? `in ${[...S.borough].join(' or ')}` : 'anywhere in NYC'
    return `<span>${n}</span> places for <a data-step="0">${esc(join('services', 'any kind of help'))}</a> for <a data-step="1">${esc(join('who', 'anyone'))}</a>, <a data-step="2">${esc(where)}</a>`
  }
  function resultsView() {
    return `<div class="res"><div class="res-head"><p class="sentence" id="b-sent"></p>
      <div class="res-tools"><div class="seg"><button data-t="list" aria-pressed="${tab === 'list'}">List</button><button data-t="map" aria-pressed="${tab === 'map'}">Map</button></div>
      <div class="seg" id="b-how"></div>
      <div id="b-place2" style="flex:1 1 280px;max-width:380px"></div>
      <select id="b-rad" style="width:auto" aria-label="Distance">${RADII.map((r) => `<option value="${r}" ${r === S.radius ? 'selected' : ''}>${radiusLabel(r)}</option>`).join('')}</select>
      <input id="b-q" type="search" placeholder="Search within these results" value="${esc(S.q)}">
      <div class="langs">${LANGS.map(([k, l]) => `<button data-lang="${k}" aria-pressed="${S.lang.has(k)}">${l}</button>`).join('')}</div>
      <button id="b-restart" style="margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px">Start over</button></div></div>
      <div class="res-body"><div class="res-list" id="b-list"></div><div id="b-map" ${tab === 'map' ? '' : 'style="visibility:hidden"'}></div></div></div>`
  }
  function draw() {
    if (step < 3) {
      m = null
      app.innerHTML = `<div class="vb">${stepView()}</div>`
      pw = step === 2 ? placeWidget($('#b-place'), (p) => { S.place = p; draw() }) : null
      if (step === 2) {
        // Location picker only: no resource dots here, so the results page is where people look at places.
        // Clicking the map sets the pin in place, without rebuilding the step (which would recreate the map).
        const pm = makeMap('b-pickmap', { onPick: (p) => {
          S.place = p; pw.set(p)
          const list = results(S)
          pm.update([], S)
          $('.vb .nav .go').textContent = `Show ${list.length} resources`
          showState(list)
        } })
        pm.update([], S)
      }
      showState(results(S))
      return
    }
    app.innerHTML = `<div class="vb">${resultsView()}</div>`
    const pw2 = placeWidget($('#b-place2'), (p) => { S.place = p; refresh() })
    m = makeMap('b-map', { onPick: (p) => { S.place = p; pw2.set(p); refresh() } })
    $('#b-rad').onchange = (e) => { S.radius = +e.target.value; refresh() }
    $('#b-list').onclick = (e) => { const li = e.target.closest('[data-idx]'); if (li && !e.target.closest('a')) { setTab('map'); m.fly(all[li.dataset.idx]) } }
    $('#b-q').oninput = (e) => { S.q = e.target.value.trim(); refresh() }
    refresh()
  }
  function setTab(t) {
    tab = t
    document.querySelectorAll('.vb [data-t]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.t === t))
    $('#b-map').style.visibility = t === 'map' ? 'visible' : 'hidden'
    $('#b-list').hidden = t === 'map'
    m.resize()
  }
  function refresh() {
    const list = results(S)
    $('#b-sent').innerHTML = sentence(list.length)
    $('#b-how').innerHTML = howToggle(S)
    const near = list.filter((r) => !r.tags.how.has('remote')), remote = list.filter((r) => r.tags.how.has('remote'))
    $('#b-list').innerHTML = `<section>${near.length ? `<h3>${S.place ? 'Nearest first' : 'In person'} · ${near.length}</h3><ul class="cards" id="b-near"></ul>` : ''}${remote.length ? `<h3>By phone or online · ${remote.length}</h3><ul class="cards" id="b-remote-list"></ul>` : ''}${!list.length ? '<p class="more">Nothing matches. Click a highlighted part of the sentence to loosen it.</p>' : ''}</section>`
    if (near.length) renderCards($('#b-near'), near)
    if (remote.length) renderCards($('#b-remote-list'), remote)
    $('#b-list').hidden = tab === 'map'
    m.update(list, S)
    showState(list)
  }
  app.onclick = async (e) => {
    const t = e.target.closest('button, a[data-step]')
    if (!t) return
    if (t.dataset.how) { setHow(S, t.dataset.how); return refresh() }
    if (t.dataset.f) { toggle(S[t.dataset.f], t.dataset.k); return draw() }
    if (t.dataset.go != null) { if (pw?.pending()) await pw.resolve(); step = +t.dataset.go; return draw() }
    if (t.dataset.r != null) { S.radius = +t.dataset.r; return draw() }
    if (t.dataset.b) { toggle(S.borough, t.dataset.b); return draw() }
    if (t.dataset.step != null) { step = +t.dataset.step; return draw() }
    if (t.dataset.t) return setTab(t.dataset.t)
    if (t.dataset.lang) { toggle(S.lang, t.dataset.lang); t.setAttribute('aria-pressed', S.lang.has(t.dataset.lang)); return refresh() }
    if (t.id === 'b-restart') { Object.assign(S, newState()); step = 0; tab = 'list'; return draw() }
  }
  app.onchange = (e) => {
    if (e.target.id === 'b-remote') { S.how.clear(); if (!e.target.checked) S.how.add('in_person'); draw() }
  }
  draw()
}

// ---------- Variant C: search-first split ----------
function VariantC() {
  const app = $('#app')
  let layout = 'split', sort = 'distance', sugg = [], hi = 0, geoTimer, geoFeats = []
  app.innerHTML = `<div class="vc">
    <div class="top"><div class="brand">Resource finder</div>
      <div class="omni" id="c-omni"><span id="c-chips" style="display:contents"></span><input id="c-in" placeholder="Try: women legal, youth near 10027, spanish housing bronx…" autocomplete="off"><ul class="drop" id="c-drop" hidden></ul></div></div>
    <div class="bar"><div class="seg" id="c-seg"><button data-l="split" aria-pressed="true">Split</button><button data-l="list" aria-pressed="false">List</button><button data-l="map" aria-pressed="false">Map</button></div>
      <div class="seg" id="c-how"></div>
      <span id="c-sum" class="meta" style="font-size:13px"></span>
      <label id="c-rad-wrap">Within <select id="c-rad">${RADII.map((r) => `<option value="${r}" ${r === S.radius ? 'selected' : ''}>${radiusLabel(r)}</option>`).join('')}</select></label>
      <label>Sort <select id="c-sort"><option value="distance">Nearest</option><option value="name">Name</option></select></label>
      <span style="margin-left:auto">${legendHtml}</span></div>
    <div class="body split" id="c-body"><div class="results" id="c-res"></div><div class="mapbox"><div id="c-map"></div><div class="hint">Click anywhere on the map to search near that spot</div></div></div>
  </div>`
  const m = makeMap('c-map', { onPick: (p) => { S.place = p; render() }, onSelect: (r) => flash($(`#c-res [data-idx="${r.idx}"]`)) })
  const input = $('#c-in'), drop = $('#c-drop')

  function chips() {
    const out = []
    for (const f of ['services', 'who', 'lang', 'borough']) for (const k of S[f]) out.push(`<span class="chip ${f}"><small>${FACET_SHORT[f]}</small> ${esc(LABEL[f][k])}<button data-rm="${f}:${esc(k)}" aria-label="Remove">×</button></span>`)
    if (S.place) out.push(`<span class="chip place"><small>Near</small> ${esc(S.place.label)}<button data-rm="place" aria-label="Remove">×</button></span>`)
    if (S.q) out.push(`<span class="chip q"><small>Text</small> “${esc(S.q)}”<button data-rm="q" aria-label="Remove">×</button></span>`)
    $('#c-chips').innerHTML = out.join('')
  }
  function buildSugg() {
    const text = input.value.trim().toLowerCase()
    const items = []
    for (const f of ['services', 'who', 'lang', 'borough']) {
      const c = counts(S, f)
      const opts = FACETS[f].filter(([k, l]) => !S[f].has(k) && (text ? l.toLowerCase().split(/[\s&/,-]+/).some((w) => w.startsWith(text)) || l.toLowerCase().startsWith(text) : true) && c[k])
      if (opts.length) { items.push({ grp: FACET_TITLE[f] }); for (const [k, l] of opts) items.push({ f, k, l, n: c[k] }) }
    }
    if (geoFeats.length) { items.push({ grp: 'Places' }); for (const g of geoFeats) items.push({ place: g, l: g.label }) }
    if (text) items.push({ grp: 'Text' }, { q: input.value.trim(), l: `Search descriptions for “${input.value.trim()}”` })
    sugg = items
    const pickable = items.filter((i) => !i.grp)
    hi = Math.min(hi, pickable.length - 1)
    let j = -1
    drop.innerHTML = items.map((i) => {
      if (i.grp) return `<li class="grp">${esc(i.grp)}</li>`
      j++
      const kind = i.f ? FACET_SHORT[i.f] : i.place ? 'Near' : 'Text'
      return `<li data-j="${j}" class="${j === hi ? 'on' : ''}"><span class="k">${kind}</span>${i.f === 'services' ? `<span class="dot" style="background:${SCOLOR[i.k]}"></span>` : ''}<span>${esc(i.l)}</span>${i.n ? `<span class="count">${i.n}</span>` : ''}</li>`
    }).join('')
    drop.hidden = !pickable.length
  }
  function choose(j) {
    const i = sugg.filter((x) => !x.grp)[j]
    if (!i) return
    if (i.f) S[i.f].add(i.k)
    else if (i.place) S.place = i.place
    else if (i.q) S.q = i.q
    input.value = ''; geoFeats = []; hi = 0
    render(); buildSugg()
  }
  input.onfocus = () => buildSugg()
  input.onblur = () => setTimeout(() => (drop.hidden = true), 150)
  input.oninput = () => {
    hi = 0; buildSugg()
    clearTimeout(geoTimer)
    const v = input.value.trim()
    if (v.length >= 3 && /\d/.test(v)) geoTimer = setTimeout(async () => { geoFeats = (await geosearch(v)).slice(0, 4); buildSugg() }, 250)
    else geoFeats = []
  }
  input.onkeydown = (e) => {
    const n = sugg.filter((x) => !x.grp).length
    if (e.key === 'ArrowDown') { e.preventDefault(); hi = (hi + 1) % n; buildSugg() }
    else if (e.key === 'ArrowUp') { e.preventDefault(); hi = (hi - 1 + n) % n; buildSugg() }
    else if (e.key === 'Enter') { e.preventDefault(); choose(hi) }
    else if (e.key === 'Escape') drop.hidden = true
    else if (e.key === 'Backspace' && !input.value) { const last = [...document.querySelectorAll('#c-chips [data-rm]')].pop(); if (last) removeChip(last.dataset.rm) }
  }
  drop.onmousedown = (e) => { const li = e.target.closest('[data-j]'); if (li) { e.preventDefault(); choose(+li.dataset.j) } }
  function removeChip(id) {
    if (id === 'place') S.place = null
    else if (id === 'q') S.q = ''
    else { const [f, k] = id.split(/:(.*)/s); S[f].delete(k) }
    render()
  }
  $('#c-chips').onclick = (e) => { const b = e.target.closest('[data-rm]'); if (b) removeChip(b.dataset.rm) }
  $('#c-omni').onclick = (e) => { if (!e.target.closest('button')) input.focus() }
  $('#c-seg').onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return
    layout = b.dataset.l
    $('#c-seg').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b))
    $('#c-body').className = `body ${layout}`
    m.resize()
  }
  $('#c-how').onclick = (e) => { const b = e.target.closest('[data-how]'); if (b) { setHow(S, b.dataset.how); render() } }
  $('#c-rad').onchange = (e) => { S.radius = +e.target.value; render() }
  $('#c-sort').onchange = (e) => { sort = e.target.value; render() }
  $('#c-res').onclick = (e) => { const li = e.target.closest('[data-idx]'); if (li && !e.target.closest('a')) { if (layout === 'list') $('#c-seg [data-l=split]').click(); m.fly(all[li.dataset.idx]) } }
  $('#c-res').onmouseover = (e) => { const li = e.target.closest('[data-idx]'); m.highlight(li ? all[li.dataset.idx] : null) }

  function render() {
    chips()
    let list = results(S)
    if (sort === 'name') list = list.slice().sort((a, b) => a.name.localeCompare(b.name))
    $('#c-rad-wrap').hidden = !S.place
    $('#c-how').innerHTML = howToggle(S)
    const near = list.filter((r) => !r.tags.how.has('remote')), remote = list.filter((r) => r.tags.how.has('remote'))
    $('#c-sum').textContent = `${list.length} resources · ${list.filter((r) => r.lat != null).length} on the map`
    $('#c-res').innerHTML = `<div>${near.length ? `<h3>${S.place ? `Near ${esc(S.place.label)}` : 'In person'} · ${near.length}</h3><ul class="cards" id="c-near"></ul>` : ''}${remote.length ? `<h3>By phone or online · ${remote.length}</h3><ul class="cards" id="c-remote"></ul>` : ''}${!list.length ? '<p class="more">Nothing matches. Remove a chip (or press Backspace in the search box).</p>' : ''}</div>`
    if (near.length) renderCards($('#c-near'), near, { compact: layout === 'split' })
    if (remote.length) renderCards($('#c-remote'), remote, { compact: layout === 'split' })
    m.update(list, S)
    showState(list)
  }
  render()
}

// ---------- Prototype switcher + state readout ----------
const VARIANTS = { A: ['Map + filter rail', VariantA], B: ['Guided questions', VariantB], C: ['Search-first split', VariantC] }
const KEYS = Object.keys(VARIANTS)
const current = KEYS.includes(new URLSearchParams(location.search).get('variant')) ? new URLSearchParams(location.search).get('variant') : 'A'
const DEV = ['localhost', '127.0.0.1'].includes(location.hostname)

function go(delta) {
  const next = KEYS[(KEYS.indexOf(current) + delta + KEYS.length) % KEYS.length]
  const u = new URL(location.href)
  u.searchParams.set('variant', next)
  location.replace(u)
}
function showState(list) {
  const el = $('#proto-state')
  if (el.hidden) return
  const sets = Object.fromEntries(['services', 'who', 'lang', 'how', 'borough'].map((f) => [f, [...S[f]]]))
  el.textContent = JSON.stringify({
    variant: current, q: S.q, ...sets, place: S.place && { label: S.place.label, lat: +S.place.lat.toFixed(5), lon: +S.place.lon.toFixed(5) }, radiusMiles: S.radius,
    results: list.length, onMap: list.filter((r) => r.lat != null).length, phoneOnline: list.filter((r) => r.tags.how.has('remote')).length,
    data: stats,
  }, null, 2)
}
if (DEV) {
  $('#proto-bar').hidden = false
  $('#proto-label').textContent = `${current} · ${VARIANTS[current][0]}`
  $('#proto-prev').onclick = () => go(-1)
  $('#proto-next').onclick = () => go(1)
  $('#proto-toggle-state').onclick = () => { $('#proto-state').hidden = !$('#proto-state').hidden; showState(results(S)) }
  addEventListener('keydown', (e) => {
    if (e.target.closest?.('input, textarea, select, [contenteditable]')) return
    if (e.key === 'ArrowLeft') go(-1)
    if (e.key === 'ArrowRight') go(1)
  })
}

load().then(() => VARIANTS[current][1]()).catch((err) => {
  $('#app').innerHTML = `<p class="loading" style="color:#b00020">Could not load data: ${esc(err.message)}</p>`
  console.error(err)
})
</script>
